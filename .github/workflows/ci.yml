name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Publishing lives in `release.yml`, so nothing here writes to the repo.
permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Type check
        run: bundle exec rake typecheck

  test:
    name: Test (Ruby ${{ matrix.ruby-version }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2.8", "3.3", "3.4", "4.0", "4"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Ruby version
        run: ruby --version

      - name: Test
        run: bundle exec rake test

  package:
    name: Package
    needs: typecheck
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Read version
        id: version
        run: echo "version=$(ruby -r ./lib/zizq/version -e 'puts Zizq::VERSION')" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: ./release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zizq-ruby-package
          path: |
            target/release/zizq-*.gem
            target/release/zizq-*.gem.sha256

  integration:
    name: Integration
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: client

      - name: Read client version
        id: client-version
        working-directory: client
        run: |
          version=$(ruby -r ./lib/zizq/version -e 'puts Zizq::VERSION')
          major=${version%%.*}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - name: Find and download latest compatible server build
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          client/.github/scripts/find-server-build.sh \
            ${{ steps.client-version.outputs.major }} \
            server

      - name: Download client artifact
        uses: actions/download-artifact@v8
        with:
          name: zizq-ruby-package
          path: artifact

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          ARGS=(--binary ${{ github.workspace }}/server/zizq --gem ${{ github.workspace }}/artifact/zizq-*.gem)
          if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
            ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
          fi
          ./integration/run.sh "${ARGS[@]}"

  examples:
    name: Examples (${{ matrix.example }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - audit_log
          - uptime_monitor_sinatra
          - uptime_monitor_rails
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: examples/${{ matrix.example }}

      - name: Test
        working-directory: examples/${{ matrix.example }}
        run: bundle exec rake test

  # --- Gate (stable check name for branch protection) ---

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [test, integration, examples]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.examples.result }}" != "success" ]; then
            echo "Required checks failed or were skipped."
            echo "  Test: ${{ needs.test.result }}"
            echo "  Integration: ${{ needs.integration.result }}"
            echo "  Examples: ${{ needs.examples.result }}"
            exit 1
          fi
